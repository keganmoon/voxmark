name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    runs-on: [self-hosted, linux, moonbox]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3.11 -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt

      - name: Byte-compile sources (syntax/import sanity check)
        run: . .venv/bin/activate && python -m compileall -q .
